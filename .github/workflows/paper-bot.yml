name: paper-bot
on:
  schedule:
    - cron: "3-59/10 * * * *"   # fuera de las horas en punto, que es cuando GitHub mas se retrasa
  workflow_dispatch:
  push:
    paths: ["bot.py", ".github/workflows/paper-bot.yml"]
permissions:
  contents: write
concurrency:
  group: paper-bot
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # una pasada por minuto durante 8 minutos; la siguiente ejecucion toma el relevo
      - run: python bot.py loop --cada 60 --minutos 8 --dir docs
      - if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "paper-bot: pasada"
          git pull -q --rebase origin main || true
          git push
