name: paper-bot
on:
  schedule:
    - cron: "3-59/10 * * * *"   # fuera de las horas en punto, que es cuando GitHub mas se retrasa
  workflow_dispatch:
  push:
    paths: ["bot.py", "aprende.py", ".github/workflows/paper-bot.yml"]
permissions:
  contents: write
concurrency:
  group: paper-bot
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # siempre el ultimo estado guardado, no el del momento en que se pidio la ejecucion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # GitHub no lanza las ejecuciones programadas con puntualidad, asi que cada una trabaja ~5 horas y media:
      # una pasada por minuto, guardando cada 10. La siguiente espera en cola y toma el relevo.
      - run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          for i in $(seq 1 34); do
            python bot.py loop --cada 60 --minutos 9.5 --dir docs
            git add docs
            git diff --cached --quiet || git commit -q -m "paper-bot: pasada"
            git pull -q --rebase origin main
            git push -q
          done
